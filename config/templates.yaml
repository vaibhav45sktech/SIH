WATCH__DEFAULT:
  en: "Water update for {village}, {district}. Groundwater is being watched and is changing by about {decline_m_per_year} m per year. No action is needed now. Avoiding unnecessary pumping and checking channels for leaks will help. Questions? Contact your Krishi Vigyan Kendra."
  hi: "{district} के {village} के लिए जल अद्यतन। भूजल पर निगरानी रखी जा रही है और यह लगभग {decline_m_per_year} मीटर प्रति वर्ष बदल रहा है। अभी कोई कार्रवाई आवश्यक नहीं। अनावश्यक पंपिंग से बचना और नालियों में रिसाव की जाँच करना लाभदायक रहेगा। प्रश्न हों तो कृषि विज्ञान केंद्र से संपर्क करें।"
  pa: "{district} ਦੇ {village} ਲਈ ਪਾਣੀ ਅੱਪਡੇਟ। ਧਰਤੀ ਹੇਠਲੇ ਪਾਣੀ ਉੱਤੇ ਨਜ਼ਰ ਰੱਖੀ ਜਾ ਰਹੀ ਹੈ ਅਤੇ ਇਹ ਲਗਭਗ {decline_m_per_year} ਮੀਟਰ ਪ੍ਰਤੀ ਸਾਲ ਬਦਲ ਰਿਹਾ ਹੈ। ਹੁਣ ਕੋਈ ਕਾਰਵਾਈ ਦੀ ਲੋੜ ਨਹੀਂ। ਬੇਲੋੜੀ ਪੰਪਿੰਗ ਤੋਂ ਬਚਣਾ ਅਤੇ ਖਾਲਾਂ ਦੀ ਲੀਕ ਜਾਂਚਣਾ ਲਾਭਦਾਇਕ ਹੈ। ਸਵਾਲ ਹੋਣ ਤਾਂ ਕ੍ਰਿਸ਼ੀ ਵਿਗਿਆਨ ਕੇਂਦਰ ਨਾਲ ਸੰਪਰਕ ਕਰੋ।"

NORMAL__RECOVERED:
  en: "Good news for {village}, {district}. Groundwater levels have recovered and are back to a normal range. Continuing to avoid unnecessary pumping and to irrigate early morning or evening will help keep them there. For guidance, contact your Krishi Vigyan Kendra."
  hi: "{district} के {village} के लिए अच्छी खबर। भूजल स्तर सुधर गया है और सामान्य सीमा में वापस आ गया है। अनावश्यक पंपिंग से बचते रहना और सुबह या शाम को सिंचाई करना इसे बनाए रखने में सहायक होगा। मार्गदर्शन के लिए अपने कृषि विज्ञान केंद्र से संपर्क करें।"
  pa: "{district} ਦੇ {village} ਲਈ ਚੰਗੀ ਖ਼ਬਰ। ਧਰਤੀ ਹੇਠਲੇ ਪਾਣੀ ਦਾ ਪੱਧਰ ਸੁਧਰ ਗਿਆ ਹੈ ਅਤੇ ਆਮ ਹੱਦ ਵਿੱਚ ਵਾਪਸ ਆ ਗਿਆ ਹੈ। ਬੇਲੋੜੀ ਪੰਪਿੰਗ ਤੋਂ ਬਚਦੇ ਰਹਿਣਾ ਅਤੇ ਸਵੇਰੇ ਜਾਂ ਸ਼ਾਮ ਸਿੰਚਾਈ ਕਰਨਾ ਇਸਨੂੰ ਬਣਾਈ ਰੱਖਣ ਵਿੱਚ ਮਦਦ ਕਰੇਗਾ। ਸਲਾਹ ਲਈ ਕ੍ਰਿਸ਼ੀ ਵਿਗਿਆਨ ਕੇਂਦਰ ਨਾਲ ਸੰਪਰਕ ਕਰੋ।"
